name = "ten-biz-game"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Static files are served by the same Worker — one deploy, not Pages + Functions.
[assets]
directory = "./public"

# Free tier. The id below belongs to the database created on 13 Oct 2026.
#
# It is NOT a secret: it names the database, and reaching it still needs an
# authenticated wrangler login. Committed deliberately so a fresh clone can
# deploy straight away — running `wrangler d1 create` a second time makes a
# SECOND, empty database and orphans this one with all the data in it.
[[d1_databases]]
binding       = "DB"
database_name = "ten-biz-game"
database_id   = "658d9b22-0abe-4050-b8f3-f45f68e4fffc"

# Workers AI — free daily allowance, no API key, no GPU.
[ai]
binding = "AI"
